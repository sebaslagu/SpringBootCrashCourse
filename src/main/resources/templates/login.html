<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Spring Boot Notes</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h1>Login</h1>
            
            <div th:if="${param.registered}" class="success-message">
                Registration successful! Please log in.
            </div>
            
            <div th:if="${param.logout}" class="success-message">
                You have been logged out successfully.
            </div>
            
            <div th:if="${error}" class="error-message" th:text="${error}"></div>
            
            <form th:action="@{/web/login}" th:object="${loginForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" th:field="*{email}" required>
                    <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" th:field="*{password}" required>
                    <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            
            <div class="auth-link">
                Don't have an account? <a th:href="@{/web/register}">Register here</a>
            </div>
            
            <div class="auth-link">
                <a th:href="@{/web/home}">Back to Home</a>
            </div>
        </div>
    </div>
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>

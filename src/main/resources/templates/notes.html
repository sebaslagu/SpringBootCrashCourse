<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes - Spring Boot Notes</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Notes</h1>
            <form th:action="@{/web/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn btn-secondary">Logout</button>
            </form>
        </div>
        
        <div class="note-form-card">
            <h2 id="form-title">Create New Note</h2>
            
            <form th:action="@{/web/notes}" th:object="${noteForm}" method="post" id="noteForm">
                <input type="hidden" id="noteId" th:field="*{id}">
                
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" th:field="*{title}" required>
                    <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>
                
                <div class="form-group">
                    <label for="content">Content:</label>
                    <textarea id="content" th:field="*{content}" rows="4"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="color">Color:</label>
                    <div class="color-picker">
                        <input type="radio" name="color" id="color1" value="4294951115" th:field="*{color}">
                        <label for="color1" class="color-option" style="background-color: #FFE5B4;"></label>
                        
                        <input type="radio" name="color" id="color2" value="4293848814" th:field="*{color}">
                        <label for="color2" class="color-option" style="background-color: #FFDAEE;"></label>
                        
                        <input type="radio" name="color" id="color3" value="4289374890" th:field="*{color}">
                        <label for="color3" class="color-option" style="background-color: #DAFFDA;"></label>
                        
                        <input type="radio" name="color" id="color4" value="4292149695" th:field="*{color}">
                        <label for="color4" class="color-option" style="background-color: #E5DAFF;"></label>
                        
                        <input type="radio" name="color" id="color5" value="4278255615" checked th:field="*{color}">
                        <label for="color5" class="color-option" style="background-color: #FFFFFF;"></label>
                    </div>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Create Note</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </div>
        
        <div class="notes-list">
            <h2>Your Notes</h2>
            <div th:if="${#lists.isEmpty(notes)}" class="empty-message">
                No notes yet. Create your first note above!
            </div>
            
            <div class="notes-grid">
                <div th:each="note : ${notes}" class="note-card" th:style="'background-color: #' + ${T(java.lang.Long).toHexString(note.color).toUpperCase()}">
                    <h3 th:text="${note.title}"></h3>
                    <p th:text="${note.content}"></p>
                    <div class="note-meta">
                        <small th:text="${#temporals.format(note.createdAt, 'MMM dd, yyyy HH:mm')}"></small>
                    </div>
                    <div class="note-actions">
                        <button type="button" class="btn btn-small btn-edit"
                                th:attr="data-note-id=${note.id.toHexString()},data-note-title=${note.title},data-note-content=${note.content},data-note-color=${note.color}"
                                onclick="editNoteFromData(this)">
                            Edit
                        </button>
                        <form th:action="@{/web/notes/{id}/delete(id=${note.id.toHexString()})}" method="post" style="display: inline;" 
                              onsubmit="return confirm('Are you sure you want to delete this note?');">
                            <button type="submit" class="btn btn-small btn-delete">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/notes.js}"></script>
</body>
</html>
